<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - UBB Reservation</title>
  <!-- Link to your signup-style.css file (the style rules you provided) -->
  <link rel="stylesheet" href="styles/signup-style.css" />
</head>
<body>
  <div class="container">
    <h1>Create UBB Account</h1>
    <form id="signup-form">
      <label for="signup-email">Email UBB:</label>
      <input type="email" id="signup-email" placeholder="nume@ubbcluj.ro" required />

      <label for="signup-password">Password:</label>
      <input type="password" id="signup-password" required />

      <label for="signup-confirm-password">Confirm Password:</label>
      <input type="password" id="signup-confirm-password" required />

      <button type="submit">Create Account</button>
    </form>
    <p class="login-link">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>
  </div>

  <!-- Inline script to handle signup logic and password matching -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signupForm = document.getElementById('signup-form');
      const emailInput = document.getElementById('signup-email');
      const passwordInput = document.getElementById('signup-password');
      const confirmPasswordInput = document.getElementById('signup-confirm-password');

      signupForm.addEventListener('submit', (event) => {
        event.preventDefault(); // Prevent page refresh

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();

        // 1. Check password & confirm password match
        if (password !== confirmPassword) {
          alert('Passwords do not match!');
          return; // Stop here if they don't match
        }

        // 2. (Optional) Check if a user with this email already exists in localStorage
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const existingUser = users.find((user) => user.email === email);

        if (existingUser) {
          alert('An account with this email already exists.');
          return;
        }

        // 3. Store the new user (demo only – not secure!)
        const newUser = { email, password };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));

        alert('Account created successfully! You can now log in.');
        // Redirect to login page (if you have one)
        window.location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
