<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UBB Room Reservation</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <div id="login-container" class="container" style="display: none;">
    <h1>Login to UBB Reservation</h1>
    <form id="login-form">
      <label for="email">Email UBB:</label>
      <input type="email" id="email" required />

      <label for="password">Password:</label>
      <input type="password" id="password" required />

      <button type="submit">Sign In</button>
    </form>
  </div>

  <div id="planner-container" class="container" style="display: none;">
    <h1>UBB Room Reservation</h1>
    <form id="reservation-form">
      <label for="room-select">Select Room:</label>
      <select id="room-select" required>
        <option value="">Choose a Room</option>
      </select>

      <label for="start-time">Start Time:</label>
      <input type="time" id="start-time" required />

      <label for="end-time">End Time:</label>
      <input type="time" id="end-time" required />

      <button type="submit">Add Reservation</button>
    </form>

    <div id="reservations-list">
      <h2>Your Reservations</h2>
      <ul id="reservation-items"></ul>
    </div>
    <button id="logout-button">Log Out</button>
  </div>
  <script src="scripts/index-script.js"></script>
</body>
</html>
